<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hagur – spjallmenni Hagstofunnar</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --text: #1c2430; --muted: #66707d;
    --brand: #0b4f8a; --brand-text: #ffffff; --bot: #eef2f7; --border: #dde3ea;
    --error-bg: #fdecec; --error-text: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1a2029; --text: #e6eaf0; --muted: #9aa4b2;
      --brand: #3b8fd9; --brand-text: #ffffff; --bot: #232b36; --border: #2c3542;
      --error-bg: #3a1d1d; --error-text: #f3b4b4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 760px; display: flex; flex-direction: column; height: 100vh; padding: 0 16px; }
  header { padding: 20px 0 12px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--brand); color: var(--brand-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .bot .meta { display: block; margin-top: 6px; font-size: 0.78rem; color: var(--muted); }
  .error { align-self: flex-start; background: var(--error-bg); color: var(--error-text); }
  .loading { color: var(--muted); font-style: italic; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }
  .examples button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
  }
  .examples button:hover { border-color: var(--brand); }
  form { display: flex; gap: 8px; padding: 12px 0 20px; border-top: 1px solid var(--border); }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); min-height: 44px; max-height: 140px;
  }
  form button {
    border: 0; border-radius: 10px; padding: 0 18px; font: inherit; font-weight: 600;
    background: var(--brand); color: var(--brand-text); cursor: pointer;
  }
  form button:disabled, .examples button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: var(--muted); text-align: center; margin: auto 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Hagur</h1>
    <p>Spyrðu um búferlaflutninga eða vísitölu neysluverðs. Gögn frá Hagstofu Íslands.</p>
  </header>

  <div id="messages">
    <div class="empty" id="empty">Byrjaðu á að skrifa spurningu eða veldu dæmi hér fyrir neðan.</div>
  </div>

  <div class="examples" id="examples">
    <button type="button">Hvað fluttu margar konur og karlar frá Norðurlandi árið 2024?</button>
    <button type="button">Hver var vísitala neysluverðs í janúar 2020?</button>
    <button type="button">How many people moved from the capital in 2023?</button>
  </div>

  <form id="form">
    <textarea id="input" placeholder="Skrifaðu spurningu… (Enter til að senda)" rows="1" required></textarea>
    <button type="submit" id="send">Senda</button>
  </form>
</div>

<script>
  // Sama vefþjónn og síðan kemur frá. Breyttu ef síðan er opnuð annars staðar frá.
  const API_URL = "/spyrja";
  const TIMEOUT_MS = 150000; // Ollama getur verið hægt, sérstaklega í fyrstu fyrirspurn

  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const exampleButtons = document.querySelectorAll("#examples button");

  function addMessage(text, cls) {
    document.getElementById("empty")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function setBusy(busy) {
    send.disabled = busy;
    input.disabled = busy;
    exampleButtons.forEach(b => b.disabled = busy);
    if (!busy) input.focus();
  }

  async function ask(question) {
    addMessage(question, "user");
    const loading = addMessage("", "bot loading");
    const started = Date.now();
    const tick = () => {
      const s = Math.round((Date.now() - started) / 1000);
      loading.innerHTML = `Hagur er að hugsa<span class="dots"></span> (${s} s)`;
    };
    tick();
    const timer = setInterval(tick, 1000);
    setBusy(true);

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spurning: question }),
        signal: controller.signal,
      });
      if (!res.ok) throw new Error(`Vefþjónn svaraði með villu ${res.status}.`);
      const data = await res.json();
      const seconds = ((Date.now() - started) / 1000).toFixed(1);
      loading.remove();
      const msg = addMessage(data.svar || "(Tómt svar)", "bot");
      const meta = document.createElement("span");
      meta.className = "meta";
      const heimildir = (data.heimildir && data.heimildir.length) ? data.heimildir.join("; ") : "engin gögn fundust";
      meta.textContent = `Heimild: ${heimildir} · ${seconds} s`;
      msg.appendChild(meta);
    } catch (err) {
      loading.remove();
      let text;
      if (err.name === "AbortError") {
        text = "Svarið tók of langan tíma. Athugaðu hvort Ollama sé í gangi og reyndu aftur.";
      } else if (err instanceof TypeError) {
        text = "Næ ekki sambandi við vefþjóninn. Er uvicorn í gangi?";
      } else {
        text = err.message;
      }
      addMessage("⚠ " + text, "error");
    } finally {
      clearInterval(timer);
      clearTimeout(timeout);
      setBusy(false);
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    ask(q);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  exampleButtons.forEach(b => b.addEventListener("click", () => ask(b.textContent)));
  input.focus();
</script>
</body>
</html>
